name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with: { name: discord-pager-mac, path: dist/*.dmg }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: npm ci
      # Unsigned MSIX; sign it on the Windows box (see README) or add a
      # CSC_LINK / CSC_KEY_PASSWORD secret to sign here.
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: discord-pager-windows, path: dist/*.appx }
